<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Kasir Koperasi Picha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .glass-card { background: #FFFFFF; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-indigo-600 min-h-screen flex items-center justify-center px-4 py-8">

    <!-- Logo Branding -->
    <div class="fixed top-6 left-6 hidden sm:flex items-center gap-3 z-10">
        <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-indigo-600 font-bold text-xl shadow-md">
            P
        </div>
        <div>
            <span class="text-white font-bold text-lg tracking-tight block leading-none">Kasir Picha</span>
            <span class="text-indigo-200 text-xs">Koperasi Madrasah Mandiri</span>
        </div>
    </div>

    <div class="w-full max-w-md">
        <div class="glass-card p-6 sm:p-8 md:p-10 mx-auto">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-indigo-100 rounded-2xl flex items-center justify-center text-indigo-600 mx-auto mb-3 shadow-sm">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Masuk Kasir Picha</h2>
                <p class="text-gray-500 text-sm mt-1">Sistem Kasir &amp; Inventaris Koperasi Madrasah v2.0.0</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Email Pengguna</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm" placeholder="nama@picha.id">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Kata Sandi</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm" placeholder="••••••••">
                </div>

                <div id="login-error" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                        <input type="checkbox" checked class="rounded text-indigo-600 focus:ring-indigo-500"> Ingat sesi saya
                    </label>
                    <button type="button" onclick="alert('Silakan hubungi Administrator Koperasi (admin@picha.id) untuk mereset kata sandi Anda.')" class="text-indigo-600 font-semibold hover:text-indigo-700">Lupa sandi?</button>
                </div>

                <button type="submit" id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 text-sm mt-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    <span>Masuk ke Sistem</span>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-100 text-center text-[11px] text-gray-400">
                Offline-First (IndexedDB) &bull; Role-Based Access Control &bull; Audit Trail
            </div>
        </div>

        <div class="text-center mt-5 text-xs text-indigo-200">
            Kasir Koperasi Picha v2.0.0 &copy; 2026
        </div>
    </div>

    <script src="js/core.js"></script>
    <script>
        (async function () {
            try {
                if (typeof Picha !== 'undefined' && typeof Picha.init === 'function') {
                    await Picha.init();
                    const currentUser = Picha.getCurrentUser();
                    if (currentUser && currentUser.role) {
                        const rolePage = {
                            admin: 'dashboard-admin.html',
                            kasir: 'kasir.html',
                            kepala: 'kepala-koperasi.html',
                            pengurus: 'pengurus.html',
                            penitip: 'penitip.html',
                        };
                        const target = rolePage[currentUser.role] || 'dashboard-admin.html';
                        window.location.replace(target);
                        return;
                    }
                }
            } catch (e) {
                console.warn('[Picha Init]:', e);
            }

            const form = document.getElementById('login-form');
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value.trim();

                btn.disabled = true;
                btn.innerHTML = '<span>Memproses autentikasi...</span>';
                errorEl.classList.add('hidden');

                try {
                    const result = await Picha.login(email, password);
                    if (result.success) {
                        const rolePage = {
                            admin: 'dashboard-admin.html',
                            kasir: 'kasir.html',
                            kepala: 'kepala-koperasi.html',
                            pengurus: 'pengurus.html',
                            penitip: 'penitip.html',
                        };
                        const target = rolePage[result.user.role] || 'dashboard-admin.html';
                        window.location.replace(target);
                    } else {
                        errorEl.textContent = result.message || 'Email atau kata sandi tidak cocok.';
                        errorEl.classList.remove('hidden');
                        btn.disabled = false;
                        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg><span>Masuk ke Sistem</span>';
                    }
                } catch (err) {
                    errorEl.textContent = 'Gagal masuk: ' + (err.message || 'Terjadi kesalahan sistem.');
                    errorEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg><span>Masuk ke Sistem</span>';
                }
            });
        })();
    </script>
</body>
</html>
